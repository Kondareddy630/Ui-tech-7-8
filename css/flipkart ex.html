<!DOCTYPE html>
<html>
<head>

<style>

.container{

   width: 1200px;
   height: 250px;
   box-shadow: 0px 0px 4px black;
   margin: 50px;
   margin: 50px auto;
   border-radius: 12px;
   padding: 10px;
   display: flex;
}

.container div{
    background-color: rgb(238, 241, 233);
    padding: 15px;
    width: 300px;
    height:200px;
    margin: 10px;
    border-radius: 10px;
}

.container div img{
    width:100%;
    height: 100%;
}


</style>

</head>
<body>

    
<div class="container">

    <div>
        <img src="../images/food2.jpg">
    </div>

    
    <div>
        <img src="../images/food3.jpg">
    </div>

    
    <div>
        <img src="../images/food10.jpg">
    </div>

    
    <div>
        <img src="../images/food4.jpg">
    </div>



</div>




    
</body>
</html>
