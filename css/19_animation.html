<!DOCTYPE html>
<html>
<head>
<style>

    h1{
        text-align: center;
        font-family: cursive;
        font-size: 60px;

        animation:hello infinite 5s;
    }

   
    /*
    
    @keyframes hello{

        from{color:red;}
        to{color:blue;}

    }
*/

img{
    margin: 100px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    animation: hai infinite 1s linear;
}

@keyframes hai{
    
    0%{transform: rotate(0deg);}
    100%{transform: rotate(360deg);}

}

@keyframes hello{

    0%{color:red;}
    20%{color:blue;}
    40%{color:green;}
    60%{color:cyan;}
    80%{color:purple;}
    100%{color:goldenrod;}
}





</style>

</head>
<body>


<h1>Java Full  Stack</h1>

<img src="../images/food10.jpg">

</body>
</html>
