<!DOCTYPE html>
<html>
<head>
   
</head>
<body>



<h3>Calculator</h3>
<div>
    <input type="text" placeholder="Number1" id="t1">
</div>

<div>
    <input type="text" placeholder="Number2" id="t2">
</div>

<div>
    <input type="text" placeholder="Number3" id="t3">
</div>

<div>

    <button onclick="t3.value=Number(t1.value)+Number(t2.value)">Add</button>
    <button onclick="t3.value=t1.value-t2.value">Sub</button>
    <button onclick="t3.value=t1.value*t2.value">Mul</button>
    <button onclick="t3.value=t1.value/t2.value">Div</button>

</div>

    
</body>
</html>
