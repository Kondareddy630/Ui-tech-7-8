<!DOCTYPE html>
<html>
<head>

</head>
<body>



<script>

// add the new elements


let colors=["red","blue","cyan","purple"];
console.log(colors);


//push()
let result1=colors.push("white","black");
console.log(colors);
console.log(result1);


//unshift()

let result3=colors.unshift("grey","gold");
console.log(colors);
console.log(result3);

//splice()=>add,remove,replace

let result4=colors.splice(3,0,"hello","hai");
console.log(colors);
console.log(result4);


//pop()

let result5=colors.pop();
console.log(colors);
console.log(result5);

//shift()

let result7=colors.shift();
console.log(colors);
console.log(result7);

//splice()

//colors.splice(3);

colors.splice(3,3);
console.log(colors);

</script> 

</body>
</html>
