<script>
/*
JavaScript Operators

JavaScript operators are special symbols used to perform operations on variables and values.
*/ 

//Arithmetic operators are used to perform mathematical calculations on numeric values.

// +,-,*,/,%,**(power)(es6)


let a=10;
let b=5;

console.log(a+b);  // 15
console.log(a-b);  // 5
console.log(a*b);  // 50
console.log(a/b);  // 2
console.log(a%b);  // 0

console.log(Math.pow(2,3));// old way
console.log(2**3);// 8
console.log(5**3);// new way


console.log(123/10);
console.log(456/10);
console.log(789/10);

console.log(parseInt(123/10)); //12
console.log(parseInt(456/10));// 45
console.log(parseInt(789/10)); //78
console.log(parseInt(1234/100)); //12


console.log(parseInt(123%10)); //3
console.log(parseInt(456%10));// 6
console.log(parseInt(789%10)); //9
console.log(parseInt(1234%100)); //34

console.log(5+2);
console.log(5+2-3); // + -
console.log(100/4%5*2);
console.log(10*5%10/2);

console.log(5+2*3);
console.log(100+20/4-2*4);
console.log(2+30/5-2**3);
console.log((5+2)*3);
console.log((2+3) * (2+4));








</script>
