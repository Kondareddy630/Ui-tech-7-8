//string properties and methods


let msg1="good night";
console.log(msg1);

//length

console.log(msg1.length);
console.log(msg1[0]);
console.log(msg1[1]);
console.log(msg1[-1]);

//at()
console.log(msg1.at(0));
console.log(msg1.at(1));
console.log(msg1.at(-1));

//toUppeseCase() toLowerCase()

console.log(msg1.toUpperCase());//GOOD NIGHT
console.log(msg1.toLowerCase());//good night

let username="Raju kumar";
console.log(username);

//charAt()
console.log(username.charAt(0));
console.log(username.charAt(1));
console.log(username.charAt(2));

(username.charAt(0)>='A' && username.charAt(0)<='Z')?console.log("Valid username"):console.log("Username should start with capital letter");


//charCodeAt()

console.log(username.charCodeAt(0));//ascii value
console.log(username.charCodeAt(1));
console.log(username.charCodeAt(2));


(username.charCodeAt(0)>=65 && username.charCodeAt(0)<=90)?console.log("Valid username"):console.log("Username should start with capital letter");


// indexOf()=>FAQ

let email="a@bcdgmail.com";

console.log(email.indexOf("@"));
console.log(email.indexOf("a"));
console.log(email.indexOf("z"));//-1

(email.indexOf("@")==-1)?console.log("Invalid email"):console.log("Valid");


// includes()


console.log("Java script".includes("va"));//true
console.log("Java script".includes("java"));//false
console.log("Java script".includes("script"));//true
console.log("Java script".includes("ava"));//true

//split(),reverse()

let message="hello";
console.log(message);
console.log(message.split(""));

//wap print the string without loops(FAQ)
console.log(message.split("").reverse().join(""));


//startWith()

let tech="Java script";

console.log(tech.startsWith("Java"));//true
console.log(tech.startsWith("java"));//true

//endsWith()
console.log(tech.endsWith("script"));//true
console.log(tech.endsWith("stack"));//false

//slice(),substring(),substr() FAQ

let course="java script";
console.log(course.slice(0,4));
console.log(course.slice(5,8));
console.log(course.slice(-6,-4));
console.log(course.slice(-3));
console.log(course.slice(4,0));

console.log(course.substring(0,4));
console.log(course.substring(-6,-4));
console.log(course.substring(4,1));
console.log(course.substring(8,5));


console.log(course.substr(0,1));
console.log(course.substr(0,3));
console.log(course.substr(0,4));

console.log(course.substr(-4));
console.log(course.substr(-4,1));
console.log(course.substr(-4,3));
