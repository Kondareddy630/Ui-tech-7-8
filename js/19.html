<script>

// some(),every()

let numbers=[2,16,40,52,61];
console.log(numbers);

// some()=>at least even element 

let result1=numbers.some(function(num){
    return num%2==0;
})
console.log(result1);

//every()=>all 

let result2=numbers.every(function(num){
    return num%2==0;
})
console.log(result2);

// spread operator(...)=> used to copy the array or object data(FAQ)

console.log(allnum);
