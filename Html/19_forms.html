<!DOCTYPE html>
<html>


<head>
</head>


<body leftmargin="50px">


<form>

    <div>
        <label>Username:</label>
    </div>

    <div>
        <input type="text" placeholder="Enter Username" name="username" maxlength="10" minlength="5" required>
    </div>


    <div>
        <label>Password:</label>
    </div>

    <div>
        <input type="password" placeholder="Enter Password" name="password" maxlength="15" minlength="6" required>
    </div>


    <div>
        <label>Email:</label>
    </div>

    <div>
        <input type="email" placeholder="Email Address" name="email" required>
    </div>


    <div>
        <label>Phone Number:</label>
    </div>

    <div>
        <input type="number" placeholder="Phone number" name="phone">
    </div>

    <div>
        <label>Choose Gender:</label>
    </div>

    <div>
        <input type="radio" name="gender"  value="male"> <label>Male</label>
        <input type="radio" name="gender"  value="female"> <label>Female</label>
        <input type="radio" name="gender"  value="other"> <label>Other</label>
    </div>


    <div>
        <label>Choose Course?</label>
    </div>

    <div>
        <input type="checkbox" value="java" name="course"> <label>Java</label> 
        <input type="checkbox" value="python" name="course"> <label>Python</label>
        <input type="checkbox" value=".net" name="course"> <label>.Net</label>
        <input type="checkbox" value="react" name="course"> <label>React</label>
        <input type="checkbox" value="angular" name="course"> <label>Angular</label>
    </div>


    <div>
        <label>Date of Birth:</label>
    </div>

    <div>
        <input type="date" name="date">
    </div>

    <div>
        <label>Time:</label>
    </div>


    <div>
        <input type="time" name="time">
    </div>

    <div>
        <label>Age:</label>
    </div>

    <div>
        
<input type="range" name="age" min="18" max="100" step="2" oninput="t1.innerText = this.value">
<span id="t1"></span>
        
    </div>


    <div>
        <label>Upload Resume:</label>
    </div>

    <div>
        <input type="file" name="file" multiple>
    </div>



    <div>
        <label>Comments:</label>
    </div>

    <div>

        <textarea placeholder="Comments" cols="30" rows="5">

        </textarea>

    </div>

    <div>
        <label>Choose Technology:</label>
    </div>

    <div>

        <select name="course">

            <optgroup label="Frontend">
                <option>Html</option>
                <option>Css</option>
                <option>Java script</option>
            </optgroup>
            
           
            <optgroup label="Backend">
            <option>Java</option>
            <option>Python</option>
            <option>Node js</option>
            <option>Express js</option>
            </optgroup>

            

            <optgroup label="Database">
                <option>Oracle</option>
            <option>Mysql</option>
            <option>Mongodb</option>
            </optgroup>

        </select>

    </div>




    <div>
        <label>Choose Date:</label>
    </div>

    <div>

        <select>
            <option>1</option>
             <option>2</option>
              <option>3</option>
               <option>4</option>
                <option>5</option>
                 <option>6</option>
        </select>

        <select>
            <option>Jan</option>
            <option>Feb</option>
            <option>Mar</option>
            <option>Apr</option>
            <option>May</option>
        </select>

        <select>
            <option>2021</option>
            <option>2022</option>
            <option>2023</option>
            <option>2024</option>
            <option>2025</option>
            <option>2026</option>
        </select>
    </div>
   

    <div>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">
        
    </div>

</form>



</body>


</html>
