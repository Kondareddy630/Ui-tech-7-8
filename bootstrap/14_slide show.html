<!DOCTYPE html>
<html>

<head> 

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">


<style>
body{
margin-bottom: 500px;
}



</style>

</head>

<body>


<div class="container mt-5">


<div class="carousel slide " id="hello" data-bs-ride="carousel">


    <!-- adding images -->

    <div class="carousel-inner">

        <div class="carousel-item active" data-bs-interval="1000">
            <img src="../images/slider_one.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item" data-bs-interval="2000">
            <img src="../images/slider_two.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item" data-bs-interval="3000">
            <img src="../images/slider_three.jpg" class="d-block w-100">
        </div>
         
    </div>

    <!-- add control buttons -->

    <button class="carousel-control-next" data-bs-target="#hello" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

    <button class="carousel-control-prev" data-bs-target="#hello" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>


</div>



</div>



</body>
</html>
