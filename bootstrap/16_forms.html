<!DOCTYPE html>
<html>

<head> 

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">


<style>
body{
margin-bottom: 500px;
}



</style>

</head>

<body class="container mt-5">



<form class="border w-50 shadow p-4 m-auto rounded-2 bg-light">

    <div class="my-2">
        <h3 class="text-muted">Register Here</h3>
    </div>


    <div>
        <label class="form-label">Username:</label>
    </div>

    <div>
        <input type="text" placeholder="Username" class="form-control">
    </div>



    <div>
        <label class="form-label">Password:</label>
    </div>

    <div>
        <input type="password" placeholder="Password" class="form-control">
    </div>


    <div>
        <label class="form-label">Choose Gender:</label>
    </div>

    <div class="d-flex gap-4">

        <div class="form-check">
            <input type="radio" name="gender" class="form-check-input">
            <label class="form-check-label">Male</label>
        </div>

          <div class="form-check">
            <input type="radio" name="gender" class="form-check-input">
            <label class="form-check-label">Female</label>
          </div>


          <div class="form-check">
            <input type="radio" name="gender" class="form-check-input">
            <label class="form-check-label">Other</label>
        </div>



    </div>

    <div>
        <label class="form-label">Choose Course</label>
    </div>

    <div class="d-flex gap-4">

        <div class="form-check">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">Java</label>
        </div>


        <div class="form-check">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">Python</label>
        </div>

          <div class="form-check">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">Ui Tech</label>
        </div>




    </div>

    <div>
        <label class="form-label">Choose Age:</label>
    </div>

    <div>
        <input type="range" class="form-range">
    </div>


    <div>
        <label class="form-label">Upload Resume:</label>
    </div>

    <div>
        <input type="file" name="file" class="form-control">
    </div>

    <div>
        <label class="form-label">Select City:</label>
    </div>

    <div>
        <select class="form-select">
            <option>Hyd</option>
            <option>Pune</option>
            <option>Delhi</option>
            <option>Vizag</option>
            <option>Nellore</option>
        </select>
    </div>

    <div class="my-2 form-switch">
        <input type="checkbox" class="form-check-input">
        <label class="form-check-label">Accept Terms & Conditions</label>
    </div>

    <div class="mt-2">
        <input type="submit" class="btn btn-success">
        <input type="reset" class="btn btn-danger">

    </div>


</form>





</body>
</html>
